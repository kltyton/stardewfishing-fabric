apply from: file('../../gradle/target-conventions/base.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if ((java_version as int) < 25) {
        switch (mapping_style) {
            case 'parchment':
                mappings loom.layered {
                    officialMojangMappings()
                    parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
                }
                break
            case 'yarn':
                mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
                break
            case 'mojmap':
                mappings loom.officialMojangMappings()
                break
            default:
                throw new GradleException("Unrecognized Fabric mappings: ${mapping_style}")
        }
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
}
loom.mods {
    "${mod_id}" {
        sourceSet sourceSets.main
        sourceSet project(':common').sourceSets.main
    }
}
apply from: file('../../gradle/target-conventions/publish.gradle')
