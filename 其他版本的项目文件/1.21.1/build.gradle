plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def resolvedModVersion = providers.gradleProperty("mod_version").get()
def resolvedMinecraftVersion = providers.gradleProperty("minecraft_version").get()
def resolvedLoaderVersion = providers.gradleProperty("loader_version").get()
def resolvedArchiveName = providers.gradleProperty("archives_base_name").get()

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional integration compile-only dependencies (Fabric 1.21.1 artifacts)
    modCompileOnly "maven.modrinth:tide:2.1.1-fabric,1.21.1"
    modCompileOnly "maven.modrinth:cobblemon:1.7.3-fabric,1.21.1"
    modCompileOnly "maven.modrinth:nether-depths-upgrade:3.1.9+1.21-fabric"
    modCompileOnly "maven.modrinth:fishing-real:1.9.1-fabric,1.21.1"
}

tasks.register('layoutRegressionTest', JavaExec) {
    dependsOn compileTestJava
    classpath = files(sourceSets.test.output.classesDirs, sourceSets.main.output.classesDirs)
    mainClass = 'com.bonker.stardewfishing.client.ui.layout.ContainerOverlayLayoutTest'
}

tasks.register('minigameKeyRegressionTest', JavaExec) {
    dependsOn compileTestJava
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bonker.stardewfishing.client.input.MinigameKeyMappingTest'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn layoutRegressionTest, minigameKeyRegressionTest
}

loom {
    accessWidenerPath = file("src/main/resources/stardew_fishing.accesswidener")
}

processResources {
    inputs.property "version", resolvedModVersion
    inputs.property "minecraft_version", resolvedMinecraftVersion
    inputs.property "loader_version", resolvedLoaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": resolvedModVersion,
                "minecraft_version": resolvedMinecraftVersion,
                "loader_version": resolvedLoaderVersion
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${resolvedArchiveName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = resolvedArchiveName
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
