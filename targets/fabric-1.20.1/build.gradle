plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'java-library'
    id 'me.modmuss50.mod-publish-plugin' version "${publish_plugin_version}"
}

apply from: file('../../gradle/target-conventions/fabric.gradle')

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://mvn.devos.one/releases/' }
    maven { url = 'https://maven.parchmentmc.org' }
}

dependencies {
    modImplementation 'maven.modrinth:forge-config-api-port:v8.0.2-1.20.1-Fabric'
    modCompileOnly 'maven.modrinth:tide:lQbQQEUL'
    modCompileOnly 'curse.maven:fishing-real-348834:5273530'
    modCompileOnly 'curse.maven:jobsaddon-682362:5043002'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

loom { accessWidenerPath = file('src/main/resources/stardew_fishing.accesswidener') }

tasks.named('test', Test) { useJUnitPlatform() }
