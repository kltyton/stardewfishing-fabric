plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java-library'
    id 'me.modmuss50.mod-publish-plugin' version "${publish_plugin_version}"
}

apply from: file('../../gradle/target-conventions/fabric.gradle')

repositories {
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content { includeGroup 'fuzs.forgeconfigapiport' }
    }
}

dependencies {
    include(api("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"))
}

loom { accessWidenerPath = file('src/main/resources/stardew_fishing.classtweaker') }

tasks.register('layoutRegressionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = files(sourceSets.test.output.classesDirs, project(':common').sourceSets.main.output.classesDirs)
    mainClass = 'com.bonker.stardewfishing.client.ui.layout.ContainerOverlayLayoutTest'
}

tasks.register('fishDisplayLifecycleTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = files(sourceSets.test.output.classesDirs, project(':common').sourceSets.main.output.classesDirs)
    mainClass = 'com.bonker.stardewfishing.common.block.FishDisplayLifecycleTest'
}

tasks.named('test', Test) { failOnNoDiscoveredTests = false }
tasks.named('check') {
    dependsOn 'layoutRegressionTest', 'fishDisplayLifecycleTest'
}
